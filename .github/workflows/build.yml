name: g68-hybrid-build
on:
  push:
    branches: [ main ]
    paths:
      - 'device/**'
      - 'configs/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  schedule:
    - cron: '0 18 * * 6'      # 每周日 02:00 CST（UTC 周六 18:00）
  workflow_dispatch:
    inputs:
      stage:
        description: "构建阶段：uboot=只验证 u-boot 按键链路；full=全量固件"
        type: choice
        options: [ uboot, full ]
        default: full
      publish:
        description: "是否发布 Release"
        type: boolean
        default: true
      commit_guard_result:
        description: "包清单去重结果是否自动回写 configs/（提交带 [skip ci]）"
        type: boolean
        default: true
concurrency:
  group: g68-hybrid-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  actions: read
env:
  TZ: Asia/Shanghai
  ISTOREOS_BRANCH: istoreos-24.10
  ISTOREOS_URL: https://github.com/istoreos/istoreos.git
  # rootfs_data 分区大小（MiB）：apply-device.sh 会把上游写死的 USERDATASIZE="2048"
  # 改成 USERDATASIZE="${ROOTFS_DATA_PARTSIZE:-4096}"，这里显式固定为 4096。
  ROOTFS_DATA_PARTSIZE: "4096"
jobs:
  # ---------- 上游变更检查（定时/手动均可，push 时跳过）----------
  check-upstream:
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.c.outputs.commit }}
      changed: ${{ steps.c.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          set -eu
          C=$(git ls-remote "$ISTOREOS_URL" "refs/heads/$ISTOREOS_BRANCH" | awk '{print $1}')
          echo "upstream commit: $C"
          echo "commit=$C" >> "$GITHUB_OUTPUT"
          OLD=$(sed -n 's/^commit=//p' upstream.lock | head -1)
          if [ -n "$OLD" ] && [ "$OLD" = "$C" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "上游未变化，跳过构建"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  # ---------- 拉源码 + 应用设备层 + 静态自检 ----------
  prepare:
    needs: check-upstream
    if: always() && (github.event_name == 'push' || needs.check-upstream.outputs.changed == 'true')
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.c.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: 浅克隆 iStoreOS
        run: |
          set -eu
          for i in 1 2 3; do
            rm -rf istoreos
            if git clone --depth 1 -b "$ISTOREOS_BRANCH" "$ISTOREOS_URL" istoreos > /tmp/clone.log 2>&1; then break; fi
            echo "::warning::克隆 iStoreOS 失败（第 $i 次），输出如下："
            cat /tmp/clone.log || true
              sleep 20
          done
          [ -d istoreos/.git ] || { echo "::error::iStoreOS 克隆失败（3 次）"; exit 1; }
          git -C istoreos rev-parse HEAD > upstream.commit
          echo "commit=$(cat upstream.commit)" >> "$GITHUB_OUTPUT"
        id: c
      - name: 应用 G68 设备层
        run: set -o pipefail; sh scripts/apply-device.sh istoreos 2>&1 | tee apply-device.log
      - name: 静态自检
        run: set -o pipefail; sh scripts/selftest.sh istoreos 2>&1 | tee selftest.log
      - name: 硬件级内容审核（hw-audit，dts ↔ 驱动/配置）
        run: sh scripts/hw-audit.sh
      - name: defconfig 合理性检查
        shell: bash
        run: |
          set -euo pipefail
          cd istoreos
          make defconfig >/dev/null 2>&1 || true
          cp .config /tmp/default.config
          cp ../configs/g68-hybrid.config .config
          make defconfig >/dev/null 2>&1
          cp .config /tmp/ours.config
          echo "=== 关键符号（ours）==="
          for k in CONFIG_TARGET_ARCH_PACKAGES CONFIG_TARGET_BOARD CONFIG_TARGET_SUBTARGET CONFIG_USE_MUSL CONFIG_TARGET_KERNEL_PARTSIZE CONFIG_TARGET_ROOTFS_PARTSIZE CONFIG_TARGET_rockchip_armv8_DEVICE_nsy_g68-plus; do
            printf '  %-52s %s\n' "$k" "$(grep -m1 "^$k=" /tmp/ours.config || echo '-')"
          done
          echo "=== 被丢弃的符号（前 20）==="
          sed -n 's/^\(CONFIG_[A-Za-z0-9_.-]*\)=.*/\1/p' ../configs/g68-hybrid.config > /tmp/syms.txt
          # 注意：不要写成 `done ... | head -20` —— pipefail 下 head 提前退出会让 echo 收到 EPIPE 而让整步失败
          while read -r sym; do
            grep -q "^$sym=" /tmp/ours.config || echo "  DROPPED $sym"
          done < /tmp/syms.txt > /tmp/dropped.txt 2>/dev/null || true
          head -20 /tmp/dropped.txt || true
          grep -q "CONFIG_TARGET_rockchip_armv8_DEVICE_nsy_g68-plus=y" /tmp/ours.config \
            || { echo "::error::defconfig 未选中 G68 设备"; exit 1; }
      - name: 以上游包清单为基准去重（package-guard）
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -s /tmp/default.config ]; then
            echo "::warning::上游默认 defconfig 缺失，跳过包清单去重"
            exit 0
          fi
          mkdir -p package-guard-out
          args=()
          args+=(--upstream-config /tmp/default.config)
          args+=(--hybrid-config configs/g68-hybrid.config)
          args+=(--out-dir package-guard-out)
          args+=(--json package-guard-out/report.json)
          args+=(--md package-guard-out/report.md)
          [ -f configs/builtin-list.txt ] && args+=(--builtin-list configs/builtin-list.txt)
          for f in istoreos/feeds/*.index; do [ -f "$f" ] && args+=(--index "$f"); done
          args+=(--makefile-dir istoreos/package --makefile-dir istoreos/feeds)
          echo "package-guard: ${args[*]}"
          python3 scripts/package-guard.py "${args[@]}" || echo "::warning::package-guard 返回非零（仅报告，不阻塞）"
          if [ -f package-guard-out/report.md ]; then cat package-guard-out/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: 上传包清单去重报告
        uses: actions/upload-artifact@v4
        with:
          name: package-guard-report
          path: package-guard-out/
          if-no-files-found: warn
          retention-days: 30
      - name: 回写去重结果到 configs/
        if: ${{ github.event_name != 'pull_request' && !contains(github.event.inputs.commit_guard_result, 'false') }}
        run: |
          set -eu
          if [ ! -s package-guard-out/builtin-list.txt ] || [ ! -s package-guard-out/g68-hybrid.config ]; then
            echo "无去重结果，跳过回写"
            exit 0
          fi
          cp package-guard-out/builtin-list.txt configs/builtin-list.txt
          cp package-guard-out/g68-hybrid.config configs/g68-hybrid.config
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs/builtin-list.txt configs/g68-hybrid.config
          if git diff --cached --quiet; then echo "无重复项，无需回写"; exit 0; fi
          git commit -m "chore(packages): 以上游包清单为基准注释重复项 [skip ci]"
          # 并发保护：prepare 运行期间远端可能已有新提交（例如 DTS 修复），
          # 直接 push 会 non-fast-forward 失败（深度扫描 run 42956738930 实测）。
          # 先同步远端并 rebase；任一步失败只告警跳过，下次构建会重新生成注释副本。
          BRANCH="${GITHUB_REF_NAME}"
          if ! git fetch --quiet --unshallow origin "$BRANCH" 2>/dev/null \
             && ! git fetch --quiet origin "$BRANCH"; then
            echo "::warning::无法同步远端，跳过本次回写（下次构建会重新生成）"
            exit 0
          fi
          if ! git rebase --quiet "origin/$BRANCH"; then
            git rebase --abort || true
            echo "::warning::回写与远端新提交冲突，跳过本次回写（下次构建会重新生成）"
            exit 0
          fi
          if ! git push origin "HEAD:$BRANCH"; then
            echo "::warning::回写推送失败（并发或权限），跳过本次回写（下次构建会重新生成）"
            exit 0
          fi
          echo "回写完成：$(git rev-parse --short HEAD)"
      - name: 上传自检报告
        uses: actions/upload-artifact@v4
        with:
          name: selftest-report
          path: |
            apply-device.log
            selftest.log
          if-no-files-found: warn
  # ---------- u-boot 单独构建 + 按键链路断言 ----------
  uboot-check:
    needs: prepare
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 拉源码并应用设备层
        run: |
          set -eu
          for i in 1 2 3; do
            rm -rf istoreos
            if git clone --depth 1 -b "$ISTOREOS_BRANCH" "$ISTOREOS_URL" istoreos > /tmp/clone.log 2>&1; then break; fi
            echo "::warning::克隆 iStoreOS 失败（第 $i 次），输出如下："
            cat /tmp/clone.log || true
              sleep 20
          done
          [ -d istoreos/.git ] || { echo "::error::iStoreOS 克隆失败（3 次）"; exit 1; }
          sh scripts/apply-device.sh istoreos
          sh scripts/selftest.sh istoreos
      - name: 安装编译依赖（容错版）
        run: |
          set -uo pipefail
          PKGS="build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libelf-dev libncurses-dev libssl-dev python3 rsync swig unzip zlib1g-dev file wget curl ca-certificates ccache time python3-pyelftools python3-setuptools python3-dev libgnutls28-dev device-tree-compiler bc bzip2 patch perl cpio xsltproc"
          apt_ok=0
          for i in 1 2 3 4 5 6; do
            echo "== apt 尝试 $i/6 =="
            if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -qq 2>/dev/null; then
              if sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq $PKGS 2>/dev/null; then apt_ok=1; break; fi
            fi
            sleep 20
          done
          if [ "$apt_ok" != "1" ]; then
            echo "::warning::apt 源不可用（DNS/镜像问题），改为校验运行器已有工具"
          fi
          missing=""
          for t in gcc make gawk gettext wget unzip python3 swig rsync bc cpio git file bzip2 perl; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          if [ -n "$missing" ]; then echo "::error::缺少关键工具:$missing（apt 与预装均不可用）"; exit 1; fi
          python3 -c 'import elftools' 2>/dev/null || python3 -m pip install --quiet pyelftools 2>/dev/null || echo "::warning::pyelftools 缺失（后续 RK 打包可能需要，若失败再处理）"
          gcc --version | head -1
          ccache --version 2>/dev/null | head -1 || echo "::warning::无 ccache（仅影响缓存速度）"
          python3 --version
          python3 -c 'import elftools; print("pyelftools", elftools.__version__)' 2>/dev/null || true
      - name: 更新 feeds
        run: |
          cd istoreos
          ./scripts/feeds update -a >/dev/null
          ./scripts/feeds install -a >/dev/null
          echo "feeds 安装完成"
      - name: 只编译 u-boot
        shell: bash
        run: |
          set -euo pipefail
          cd istoreos
          cp ../configs/g68-hybrid.config .config
          make defconfig
          grep -q "CONFIG_TARGET_rockchip_armv8_DEVICE_nsy_g68-plus=y" .config || \
            { echo "::error::defconfig 未选中 G68 设备"; grep -E "TARGET_rockchip" .config | head; exit 1; }
          make -j"$(nproc)" tools/install 2>&1 | tail -5
          make -j"$(nproc)" toolchain/install 2>&1 | tail -10
          ls -l staging_dir/toolchain-*/lib/ld-musl-*.so* | head -3
          make -j"$(nproc)" package/boot/uboot-rockchip/compile V=s 2>&1 | tail -40
      - name: 核心功能守卫（长按 Reset→MaskROM 产物级校验）
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/verify-maskrom.sh istoreos --built
  build:
    needs: [ prepare, uboot-check ]
    if: always() && needs.prepare.result == 'success' && needs.uboot-check.result == 'success' && (inputs.stage == 'full' || github.event_name != 'workflow_dispatch')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 拉源码并应用设备层
        run: |
          set -eu
          for i in 1 2 3; do
            rm -rf istoreos
            if git clone --depth 1 -b "$ISTOREOS_BRANCH" "$ISTOREOS_URL" istoreos > /tmp/clone.log 2>&1; then break; fi
            echo "::warning::克隆 iStoreOS 失败（第 $i 次），输出如下："
            cat /tmp/clone.log || true
              sleep 20
          done
          [ -d istoreos/.git ] || { echo "::error::iStoreOS 克隆失败（3 次）"; exit 1; }
          sh scripts/apply-device.sh istoreos
          sh scripts/selftest.sh istoreos
          ( cd istoreos && ./scripts/feeds update -a >/dev/null && ./scripts/feeds install -a >/dev/null )
          cp configs/g68-hybrid.config istoreos/.config
          cd istoreos
          make defconfig 2>&1 | tail -20
          echo "=== 关键配置确认 ==="
          grep -E "CONFIG_TARGET_rockchip_armv8_DEVICE_nsy_g68-plus|CONFIG_TARGET_KERNEL_PARTSIZE|CONFIG_TARGET_ROOTFS_PARTSIZE|CONFIG_PACKAGE_luci-app-store" .config || true
      - name: 缓存 dl
        uses: actions/cache@v4
        with:
          path: istoreos/dl
          key: dl-${{ github.run_id }}
          restore-keys: |
            dl-
      - name: 安装编译依赖（容错版）
        run: |
          set -uo pipefail
          PKGS="build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libelf-dev libncurses-dev libssl-dev python3 rsync swig unzip zlib1g-dev file wget curl ca-certificates ccache time python3-pyelftools python3-setuptools python3-dev libgnutls28-dev device-tree-compiler bc bzip2 patch perl cpio xsltproc"
          apt_ok=0
          for i in 1 2 3 4 5 6; do
            echo "== apt 尝试 $i/6 =="
            if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -qq 2>/dev/null; then
              if sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq $PKGS 2>/dev/null; then apt_ok=1; break; fi
            fi
            sleep 20
          done
          if [ "$apt_ok" != "1" ]; then
            echo "::warning::apt 源不可用（DNS/镜像问题），改为校验运行器已有工具"
          fi
          missing=""
          for t in gcc make gawk gettext wget unzip python3 swig rsync bc cpio git file bzip2 perl; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          if [ -n "$missing" ]; then echo "::error::缺少关键工具:$missing（apt 与预装均不可用）"; exit 1; fi
          python3 -c 'import elftools' 2>/dev/null || python3 -m pip install --quiet pyelftools 2>/dev/null || echo "::warning::pyelftools 缺失（后续 RK 打包可能需要，若失败再处理）"
          gcc --version | head -1
          ccache --version 2>/dev/null | head -1 || echo "::warning::无 ccache（仅影响缓存速度）"
          python3 --version
          python3 -c 'import elftools; print("pyelftools", elftools.__version__)' 2>/dev/null || true
      - name: 核心功能守卫（编译前，防被覆盖）
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/verify-maskrom.sh istoreos
      - name: 编译固件
        shell: bash
        run: |
          set -euo pipefail
          cd istoreos
          if ! make -j"$(nproc)" 2>&1 | tee ../build.log; then
            echo "::warning::并行构建失败，单线程重试（V=s）"
            make -j1 V=s 2>&1 | tee -a ../build.log
          fi
      - name: 收集产物
        run: |
          set -eu
          IMG=$(find istoreos/bin/targets/rockchip/armv8 -name '*nsy_g68-plus*sysupgrade.img.gz' | head -1)
          [ -n "$IMG" ] || { echo "::error::未找到固件镜像"; ls -l istoreos/bin/targets/rockchip/armv8 2>/dev/null || true; exit 1; }
          cp "$IMG" .
          # 校验 rootfs_data=4096MiB：必须读 MBR 分区表，不能用镜像体积。
          # 上游 pine64-img 未设置 PADDING，gen_image_generic.sh 不会把 userdata 分区
          # dd 填零，镜像文件只有 kernel+rootfs（约 216 MiB），但分区表标称 4096 MiB。
          # check-partition-table.py 只读 gzip 流前 512 字节，无需解压整盘。
          python3 scripts/check-partition-table.py "$IMG" "$ROOTFS_DATA_PARTSIZE"
          SHA=$(sha256sum "$(basename "$IMG")" | awk '{print $1}')
          CNT=$(grep -h ' - ' istoreos/bin/targets/rockchip/armv8/*.manifest 2>/dev/null | wc -l)
          cat istoreos/bin/targets/rockchip/armv8/*.manifest > ./packages.manifest
          sha256sum "$(basename "$IMG")" > sha256sums
          echo "IMG=$(basename "$IMG")" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "PKGCOUNT=$CNT" >> "$GITHUB_ENV"
          [ -f "istoreos/bin/targets/rockchip/armv8/$(basename "$IMG" .gz).sha256" ] && cp "istoreos/bin/targets/rockchip/armv8/$(basename "$IMG" .gz).sha256" . || true
          ls -lh "$(basename "$IMG")"
      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: 上传固件 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: g68-hybrid-image-${{ github.run_number }}
          path: |
            *.img.gz
            *.sha256
            *.sha256sums
          retention-days: 14
      - name: 发布 Release
        if: github.event_name != 'workflow_dispatch' || inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          BASE="g68-hybrid-$(date -u +%Y.%m.%d)"
          TAG="$BASE"; n=1
          while gh release view "$TAG" >/dev/null 2>&1; do TAG="$BASE-r$n"; n=$((n+1)); done
          {
            echo "## NSY G68-PLUS (RK3568) · iStoreOS 24.10 杂交固件"
            echo ""
            echo "- 设备树/env: 取自 NSY G68 immortalwrt（含长按 Reset 进 MaskROM）"
            echo "- 基座: iStoreOS \`$ISTOREOS_BRANCH\` @ \`$(sed -n 's/^commit=//p' upstream.lock)\`"
            echo "- 包数: **${PKGCOUNT}** 个"
            echo "- 镜像 sha256: \`${SHA}\`"
            echo ""
            echo "### 刷机（与 immortalwrt 完全一致）"
            echo "1. USB 双公头线连接电脑与设备（OTG/靠网口 USB）"
            echo "2. RKDevTool v3.18 + 驱动 v5.12"
            echo "3. 断电 → **按住 Reset** 上电 → 松开 → 显示 MaskROM 设备"
            echo "4. 高级功能 → Boot 选 \`rk356x_spl_loader_v1.21.113.bin\` → 下载"
            echo "5. 获取当前存储 / **擦除所有**"
            echo "6. 下载镜像（解压后的 .img）→ **勾选「强制按地址写」** → 执行"
            echo ""
            echo "> 若长按无效，可用短接触点法兜底（BROM 模式，loader 相同）"
          } > notes.md
          gh release create "$TAG" *.img.gz sha256sums packages.manifest --title "G68 iStoreOS 杂交固件 $TAG" --notes-file notes.md || \
            gh release upload "$TAG" *.img.gz sha256sums packages.manifest --clobber
      - name: 回写 upstream.lock
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          {
            printf 'branch=%s\n' "$ISTOREOS_BRANCH"
            printf 'commit=%s\n' "$(git -C istoreos rev-parse HEAD)"
            printf 'feeds:\n'
            for d in istoreos/feeds/*/; do
              [ -d "$d/.git" ] || continue
              printf '  %s %s\n' "$(basename "$d")" "$(git -C "$d" rev-parse HEAD 2>/dev/null || echo unknown)"
            done
          } > upstream.lock
          git add upstream.lock
          git commit -m "chore: 记录已构建的 iStoreOS 上游 commit" || true
          git push || echo "::warning::upstream.lock 回写推送失败（检查 workflow 的 contents: write 权限）"
          echo "---- upstream.lock ----"; cat upstream.lock
      - name: 失败时自动开 issue（同类复用，不重复开）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TITLE="CI 构建失败: $GITHUB_RUN_NUMBER"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          FAILED=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | join(", ")' 2>/dev/null || echo "未知")
          BODY=$(cat <<EOF
          ## 构建失败
          | 项目 | 值 |
          | --- | --- |
          | 运行 | [#$GITHUB_RUN_NUMBER]($RUN_URL) |
          | 提交 | \`${GITHUB_SHA:0:8}\` |
          | 触发方式 | ${GITHUB_EVENT_NAME} |
          | 失败步骤 | ${FAILED} |
          ### 排查
          1. 打开 [运行日志]($RUN_URL)，展开失败步骤（编译步骤已 tee 全量日志到 build.log artifact）；
          2. 修复后重新触发构建，成功时该 issue 会自动关闭。
          > 同一根因的连续失败会追加评论到本 issue，不再重复新建。
          EOF
          )
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq '[.[] | select(.title | startswith("CI 构建失败")) | .number] | first // empty' 2>/dev/null || true)
          if [ -n "${EXISTING:-}" ]; then
            echo "已有未关闭的失败 issue #$EXISTING，追加评论"
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY" || true
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" || true
          fi
      - name: 成功时自动关闭失败 issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          NUMS=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq '.[] | select(.title | startswith("CI 构建失败")) | .number' 2>/dev/null || true)
          for n in $NUMS; do
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" \
              --body "构建已通过（run #$GITHUB_RUN_NUMBER，提交 \`${GITHUB_SHA:0:8}\`），自动关闭。" || true
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason completed || true
            echo "已关闭 issue #$n"
          done
          if [ -z "$NUMS" ]; then echo "没有未关闭的失败 issue"; fi
          exit 0
