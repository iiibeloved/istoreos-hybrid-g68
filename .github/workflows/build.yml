name: g68-hybrid-build

on:
  push:
    branches: [ main ]
    paths:
      - 'device/**'
      - 'configs/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  schedule:
    - cron: '0 18 * * 6'      # 每周日 02:00 CST（UTC 周六 18:00）
  workflow_dispatch:
    inputs:
      stage:
        description: "构建阶段：uboot=只验证 u-boot 按键链路；full=全量固件"
        type: choice
        options: [ uboot, full ]
        default: full
      publish:
        description: "是否发布 Release"
        type: boolean
        default: true

concurrency:
  group: g68-hybrid-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: read

env:
  TZ: Asia/Shanghai
  ISTOREOS_BRANCH: istoreos-24.10
  ISTOREOS_URL: https://github.com/istoreos/istoreos.git

jobs:
  # ---------- 上游变更检查（定时/手动均可，push 时跳过）----------
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.c.outputs.commit }}
      changed: ${{ steps.c.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          set -eu
          C=$(git ls-remote "$ISTOREOS_URL" "refs/heads/$ISTOREOS_BRANCH" | awk '{print $1}')
          echo "upstream commit: $C"
          echo "commit=$C" >> "$GITHUB_OUTPUT"
          OLD=$(sed -n 's/^commit=//p' upstream.lock | head -1)
          if [ -n "$OLD" ] && [ "$OLD" = "$C" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "上游未变化，跳过构建"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------- 拉源码 + 应用设备层 + 静态自检 ----------
  prepare:
    needs: check-upstream
    if: always() && (github.event_name == 'push' || needs.check-upstream.outputs.changed == 'true')
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.c.outputs.commit }}
    steps:
      - uses: actions/checkout@v4

      - name: 浅克隆 iStoreOS
        run: |
          set -eu
          git clone --depth 1 -b "$ISTOREOS_BRANCH" "$ISTOREOS_URL" istoreos
          git -C istoreos rev-parse HEAD > upstream.commit
          echo "commit=$(cat upstream.commit)" >> "$GITHUB_OUTPUT"
        id: c

      - name: 应用 G68 设备层
        run: sh scripts/apply-device.sh istoreos 2>&1 | tee apply-device.log

      - name: 静态自检
        run: sh scripts/selftest.sh istoreos 2>&1 | tee selftest.log

      - name: defconfig 合理性检查
        run: |
          set -eu
          cd istoreos
          # 基线：iStoreOS 默认 defconfig
          make defconfig >/dev/null 2>&1 || true
          cp .config /tmp/default.config
          # 应用我们的配置
          cp ../configs/g68-hybrid.config .config
          make defconfig >/dev/null 2>&1
          cp .config /tmp/ours.config
          echo "=== 关键符号（ours vs default）==="
          for k in CONFIG_TARGET_ARCH_PACKAGES CONFIG_TARGET_BOARD CONFIG_TARGET_SUBTARGET \
                   CONFIG_USE_MUSL CONFIG_TARGET_KERNEL_PARTSIZE CONFIG_TARGET_ROOTFS_PARTSIZE \
                   CONFIG_TARGET_rockchip_armv8_DEVICE_nsy_g68-plus; do
            printf '%-52s ours=%-28s default=%s\n' "$k" \
              "$(grep -m1 "^$k=" /tmp/ours.config || echo -)" \
              "$(grep -m1 "^$k=" /tmp/default.config || echo -)"
          done
          echo "=== 我们配置里被丢弃的符号（前 20）==="
          sed -n 's/^\(CONFIG_[A-Za-z0-9_.-]*\)=.*/\1/p' ../configs/g68-hybrid.config | while read -r sym; do
            grep -q "^$sym=" /tmp/ours.config || echo "  DROPPED $sym"
          done | head -20
          grep -q "CONFIG_TARGET_rockchip_armv8_DEVICE_nsy_g68-plus=y" /tmp/ours.config || { echo "::error::设备未选中"; exit 1; }

      - name: 上传自检报告
        uses: actions/upload-artifact@v4
        with:
          name: selftest-report
          path: |
            apply-device.log
            selftest.log
          if-no-files-found: warn

  # ---------- u-boot 单独构建 + 按键链路断言 ----------
  uboot-check:
    needs: prepare
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 拉源码并应用设备层
        run: |
          set -eu
          git clone --depth 1 -b "$ISTOREOS_BRANCH" "$ISTOREOS_URL" istoreos
          sh scripts/apply-device.sh istoreos >/dev/null
          sh scripts/selftest.sh istoreos >/dev/null
      - name: 安装依赖
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential libncurses-dev gawk git gettext libssl-dev xsltproc wget unzip python3 python3-pyelftools swig zstd rsync bc cpio

      - name: 更新 feeds
        run: |
          cd istoreos
          ./scripts/feeds update -a >/dev/null
          ./scripts/feeds install -a >/dev/null
          echo "feeds 安装完成"

      - name: 只编译 u-boot
        shell: bash
        run: |
          set -euo pipefail
          cd istoreos
          cp ../configs/g68-hybrid.config .config
          make defconfig
          grep -q "CONFIG_TARGET_rockchip_armv8_DEVICE_nsy_g68-plus=y" .config || \
            { echo "::error::defconfig 未选中 G68 设备"; grep -E "TARGET_rockchip" .config | head; exit 1; }
          make -j"$(nproc)" tools/install 2>&1 | tail -5
          make -j"$(nproc)" toolchain/install 2>&1 | tail -10
          ls -l staging_dir/toolchain-*/lib/ld-musl-*.so* | head -3
          make -j"$(nproc)" package/boot/uboot-rockchip/compile V=s 2>&1 | tail -40

      - name: 断言按键链路（overlay + .config + strings）
        shell: bash
        run: |
          set -uo pipefail
          BIN=$(find istoreos/build_dir -name 'u-boot-rockchip.bin' -path '*nsy-g68-plus*' | head -1 || true)
          [ -n "$BIN" ] || BIN=$(find istoreos/staging_dir -name 'nsy-g68-plus-rk3568-u-boot-rockchip.bin' | head -1 || true)
          if [ -z "$BIN" ]; then echo "::error::未找到 G68 的 u-boot-rockchip.bin"; find istoreos/build_dir -maxdepth 3 -name 'u-boot-*' -type d | head; exit 1; fi
          echo "u-boot-rockchip.bin: $BIN ($(stat -c%s "$BIN") 字节)"

          SRC=$(find istoreos/build_dir -path '*u-boot-2024.10/arch/arm/mach-rockchip/rk3568/rk3568.c' -path '*nsy-g68-plus*' | head -1)
          if [ -n "$SRC" ]; then
            echo "--- 构建树里的 rk3568.c ---"
            echo "注入块出现次数: $(grep -c 'NSY-G68 long-press Reset' "$SRC")"
            grep -n 'spl_board_init\|rockchip_dnl_key_pressed\|NSY_G68_DNL_ADC_CHAN' "$SRC" | head -6
          else
            echo "::warning::构建树中未找到 rk3568.c"
          fi

          CFG=$(find istoreos/build_dir -path '*u-boot-2024.10/.config' -path '*nsy-g68-plus*' | head -1)
          [ -n "$CFG" ] || CFG=$(find istoreos/build_dir -path '*u-boot-2024.10/.config' | head -1)
          echo "--- u-boot .config 关键项 ($CFG) ---"
          grep -E "^CONFIG_(DM|ADC|SPL_DM|SPL_ADC|SARADC_ROCKCHIP|CMD_ADC|ROCKCHIP_BOOT_MODE_REG)=" "$CFG" || echo "  (无匹配项)"

          FAIL=0
          strings "$BIN" | grep -q "download key pressed" && echo "  [OK] download key pressed" || { echo "::error::缺少 download key pressed"; FAIL=1; }
          strings "$BIN" | grep -q "adc_channel_single_shot" && echo "  [OK] adc_channel_single_shot" || { echo "::error::缺少 adc_channel_single_shot（ADC 未启用）"; FAIL=1; }
          strings "$BIN" | grep -q "saradc" && echo "  [OK] saradc" || { echo "::warning::缺少 saradc 字符串"; }
          grep -q "^CONFIG_ROCKCHIP_BOOT_MODE_REG=0xfdc20200" "$CFG" || { echo "::error::BOOT_MODE_REG != 0xfdc20200"; FAIL=1; }
          [ "$FAIL" = "0" ] || { echo "::error::u-boot 按键链路断言未通过"; exit 1; }
          echo "u-boot 按键链路断言通过 ✅"

  # ---------- 全量固件构建 ----------
  build:
    needs: [ prepare, uboot-check ]
    if: always() && needs.prepare.result == 'success' && needs.uboot-check.result == 'success' && (inputs.stage == 'full' || github.event_name != 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 拉源码并应用设备层
        run: |
          set -eu
          git clone --depth 1 -b "$ISTOREOS_BRANCH" "$ISTOREOS_URL" istoreos
          sh scripts/apply-device.sh istoreos
          sh scripts/selftest.sh istoreos
          ( cd istoreos && ./scripts/feeds update -a >/dev/null && ./scripts/feeds install -a >/dev/null )
          cp configs/g68-hybrid.config istoreos/.config
          cd istoreos
          make defconfig 2>&1 | tail -20
          echo "=== 关键配置确认 ==="
          grep -E "CONFIG_TARGET_rockchip_armv8_DEVICE_nsy_g68-plus|CONFIG_TARGET_KERNEL_PARTSIZE|CONFIG_TARGET_ROOTFS_PARTSIZE|CONFIG_PACKAGE_luci-app-store" .config || true

      - name: 缓存 dl
        uses: actions/cache@v4
        with:
          path: istoreos/dl
          key: dl-${{ github.run_id }}
          restore-keys: |
            dl-

      - name: 安装依赖
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential libncurses-dev gawk git gettext libssl-dev xsltproc wget unzip python3 python3-pyelftools swig zstd rsync bc cpio time

      - name: 编译固件
        shell: bash
        run: |
          set -euo pipefail
          cd istoreos
          make -j"$(nproc)" 2>&1 | tail -60 || { echo "并行构建失败，单线程重试"; make -j1 V=s 2>&1 | tail -120; }

      - name: 收集产物
        run: |
          set -eu
          IMG=$(find istoreos/bin/targets/rockchip/armv8 -name '*nsy_g68-plus*sysupgrade.img.gz' | head -1)
          [ -n "$IMG" ] || { echo "::error::未找到固件镜像"; ls -l istoreos/bin/targets/rockchip/armv8 2>/dev/null || true; exit 1; }
          cp "$IMG" .
          SHA=$(sha256sum "$(basename "$IMG")" | awk '{print $1}')
          CNT=$(grep -c '^Package:' istoreos/bin/targets/rockchip/armv8/*.manifest 2>/dev/null || echo "?")
          echo "IMG=$(basename "$IMG")" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "PKGCOUNT=$CNT" >> "$GITHUB_ENV"
          [ -f "istoreos/bin/targets/rockchip/armv8/$(basename "$IMG" .gz).sha256" ] && cp "istoreos/bin/targets/rockchip/armv8/$(basename "$IMG" .gz).sha256" . || true
          ls -lh "$(basename "$IMG")"

      - name: 发布 Release
        if: inputs.publish != false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          BASE="g68-hybrid-$(date -u +%Y.%m.%d)"
          TAG="$BASE"; n=1
          while gh release view "$TAG" >/dev/null 2>&1; do TAG="$BASE-r$n"; n=$((n+1)); done
          {
            echo "## NSY G68-PLUS (RK3568) · iStoreOS 24.10 杂交固件"
            echo ""
            echo "- 设备树/env: 取自 NSY G68 immortalwrt（含长按 Reset 进 MaskROM）"
            echo "- 基座: iStoreOS \`$ISTOREOS_BRANCH\` @ \`$(sed -n 's/^commit=//p' upstream.lock)\`"
            echo "- 包数: **${PKGCOUNT}** 个"
            echo "- 镜像 sha256: \`${SHA}\`"
            echo ""
            echo "### 刷机（与 immortalwrt 完全一致）"
            echo "1. USB 双公头线连接电脑与设备（OTG/靠网口 USB）"
            echo "2. RKDevTool v3.18 + 驱动 v5.12"
            echo "3. 断电 → **按住 Reset** 上电 → 松开 → 显示 MaskROM 设备"
            echo "4. 高级功能 → Boot 选 \`rk356x_spl_loader_v1.21.113.bin\` → 下载"
            echo "5. 获取当前存储 / **擦除所有**"
            echo "6. 下载镜像（解压后的 .img）→ **勾选「强制按地址写」** → 执行"
            echo ""
            echo "> 若长按无效，可用短接触点法兜底（BROM 模式，loader 相同）"
          } > notes.md
          gh release create "$TAG" *.img.gz *.sha256 --title "G68 iStoreOS 杂交固件 $TAG" --notes-file notes.md || \
            gh release upload "$TAG" *.img.gz *.sha256 --clobber

      - name: 回写 upstream.lock
        if: success() && inputs.publish != false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          printf 'branch=%s\ncommit=%s\n' "$ISTOREOS_BRANCH" "$(git -C istoreos rev-parse HEAD)" > upstream.lock
          git add upstream.lock
          git commit -m "chore: 记录已构建的 iStoreOS 上游 commit" || true
          git push || true

      - name: 失败时自动开 issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "CI 构建失败: $GITHUB_RUN_NUMBER" \
            --body "构建失败，日志：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
