<script type="text/javascript">//<![CDATA[
	XHR.poll(5, '<%=url("admin/services/istoreenhance_status")%>', null,
		function(x, st)
		{
			var tb = document.getElementById('istoreenhance_status');
			if (st && tb)
			{
				if (st.running)
				{
					tb.innerHTML = '<br/><em style=\"color:green\"><%:KSpeeder 服务正在运行。%></em>'
						+ "<br/><br/><input class=\"btn cbi-button cbi-button-apply\" type=\"button\" value=\" <%:打开 KSpeeder%> \" onclick=\"window.open('<%=url("admin/services/linkease_apps/open")%>?id=kspeeder')\"/>";
				}
				else
				{
					tb.innerHTML = '<br/><em style=\"color:red\"><%:KSpeeder 服务未运行。%></em>';
				}
			}
		}
	);
//]]></script>

<fieldset class="cbi-section">
	<legend><%:KSpeeder 状态%></legend>
	<p id="istoreenhance_status">
		<em><%:正在收集数据…%></em>
	</p>
</fieldset>
